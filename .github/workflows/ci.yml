name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  # A branch behind its base is not a failure: the gate passes with a notice and sets
  # `run=false`, which skips the test jobs. The notice is the only trace, so a stale PR
  # reads green with no tests run; update the branch to run them.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      # This step must never fail. If the compare call itself fails, run CI rather than guess
      # the branch is stale.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by) || behind=unknown
          if [ "$behind" = "0" ] || [ "$behind" = "unknown" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This branch is $behind commits behind $BASE. Update it to run CI."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json. Setting it here too
      # is an error, not a belt-and-braces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # A Next build fails on things tsc does not see — a bad asset path, a server
      # import pulled into a client component.
      - run: pnpm build

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A full run takes about 90 seconds. A hung browser or web server stops here
    # instead of burning the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pm/web exec playwright install --with-deps chromium

      # Demo mode runs off FakeSpotifyClient, so this needs no credentials — no secrets are
      # configured on this job on purpose, which is what proves spec §5.1's claim that a
      # missing SPOTIFY_CLIENT_ID is demo mode rather than a crash. Playwright builds and
      # starts the app itself; see apps/web/playwright.config.ts.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
