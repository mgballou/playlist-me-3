name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fails, rather than skips, a PR behind its base: a run whose jobs were all
  # skipped concludes success, which reads as a pass.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the branch to be current with its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Update it to run CI."
            exit 1
          fi

  check:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json. Setting it here too
      # is an error, not a belt-and-braces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # A Next build fails on things tsc does not see — a bad asset path, a server
      # import pulled into a client component.
      - run: pnpm build

  e2e:
    needs: gate
    runs-on: ubuntu-latest
    # A full run takes about 90 seconds. A hung browser or web server stops here
    # instead of burning the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pm/web exec playwright install --with-deps chromium

      # Demo mode runs off FakeSpotifyClient, so this needs no credentials — no secrets are
      # configured on this job on purpose, which is what proves spec §5.1's claim that a
      # missing SPOTIFY_CLIENT_ID is demo mode rather than a crash. Playwright builds and
      # starts the app itself; see apps/web/playwright.config.ts.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
